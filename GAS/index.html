<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PW手帳</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #fff;
    --line: #e2e6ea;
    --txt: #1f2d3d;
    --sub: #6b7785;
    --accent: #1f2d3d;
    --danger: #c0563f;
    --chip: #eef0f3;
    --r-sm: 0.5rem;
    --r-md: 0.75rem;
    --r-full: 999px;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--txt);
    padding-bottom: 4.5rem;
    font-size: 0.9375rem;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--accent);
    color: #fff;
    padding: 0.75rem 1rem;
    font-weight: 700;
    font-size: 1.0625rem;
  }
  header small {
    font-weight: 400;
    color: rgba(255, 255, 255, .75);
    font-size: 0.75rem;
    margin-left: 0.25rem;
  }
  .view {
    display: none;
    padding: 0.875rem;
  }
  .view.active {
    display: block;
  }
  .card {
    background: var(--card);
    border: 0.0625rem solid var(--line);
    border-radius: var(--r-md);
    padding: 0.875rem;
    margin-bottom: 0.75rem;
  }
  h2 {
    font-size: 0.9375rem;
    color: var(--txt);
    margin: 0.125rem 0 1rem;
    font-weight: 700;
    border-left: 0.1875rem solid var(--accent);
    padding-left: 0.5rem;
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: var(--sub);
    font-weight: 800;
    margin: 1rem 0 0.5rem;
  }
  label:first-of-type {
    margin-top: 0;
  }
  .divider {
    border-top: 0.0625rem solid var(--line);
    margin: 1rem 0 0.25rem;
  }
  input, textarea, select {
    width: 100%;
    padding: 0.625rem;
    border: 0.0625rem solid var(--line);
    border-radius: var(--r-sm);
    font-size: 0.9375rem;
    font-weight: 400;
    font-family: inherit;
    background: #fff;
    color: var(--txt);
    transition: border-color .15s, box-shadow .15s;
  }
  input.invalid, textarea.invalid {
    border-color: var(--txt);
    box-shadow: 0 0 0 0.1875rem rgba(31, 45, 61, .18);
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--txt);
    box-shadow: 0 0 0 0.1875rem rgba(31, 45, 61, .12);
  }
  input::placeholder, textarea::placeholder {
    color: var(--sub);
    opacity: 1;
    font-weight: 400;
  }
  textarea {
    resize: vertical;
    min-height: 2.75rem;
  }
  .row {
    display: flex;
    gap: 0.5rem;
  }
  .row > * {
    flex: 1;
    min-width: 0;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.25rem;
  }
  .chip {
    padding: 0.5rem 0.75rem;
    border-radius: var(--r-sm);
    background: var(--chip);
    border: 0.0625rem solid var(--line);
    font-size: 0.875rem;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button {
    font-family: inherit;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: var(--r-md);
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 0.75rem;
  }
  .btn.ghost {
    background: #fff;
    color: var(--accent);
    border: 0.0625rem solid var(--accent);
  }
  .btn {
    transition: background .15s, opacity .15s, transform .08s;
  }
  .btn:active {
    opacity: .85;
    transform: scale(.98);
  }
  .btn.danger {
    background: var(--danger);
  }
  .btn:disabled {
    opacity: .7;
    cursor: default;
  }
  /* 通信中: ボタン内にスピナーを出し、押せない状態であることを示す */
  .btn.loading {
    opacity: .85;
  }
  .btn.loading::before {
    content: "";
    display: inline-block;
    width: 1em;
    height: 1em;
    margin-right: 0.5em;
    vertical-align: -0.15em;
    border: 0.15em solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: btn-spin .7s linear infinite;
  }
  @keyframes btn-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.loading::before { animation-duration: 2s; }
  }
  /* 完了: ボタンの種類（通常/danger/ghost）に関わらず白地＋黒枠に反転させる。.danger より後ろに置くこと */
  .btn.success,
  .btn.success:disabled {
    background: #fff;
    color: var(--accent);
    border-color: transparent;
    box-shadow: inset 0 0 0 0.125rem var(--accent);
    opacity: 1;
  }
  .logitem {
    display: flex;
    align-items: flex-start;
    gap: 0.625rem;
    padding: 0.5rem 0.25rem;
    border-top: 0.0625rem solid var(--line);
  }
  .logitem:first-child {
    border-top: none;
  }
  .logheader {
    background: var(--accent);
    color: #fff;
    border-radius: 0.5rem;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.5rem;
  }
  .logheader .logtime {
    color: #fff;
    font-size: 0.6875rem;
    font-weight: 700;
    min-width: 3.25rem;
    padding-top: 0;
    border-right-color: rgba(255, 255, 255, .4);
  }
  .logheader .logtime.wide {
    min-width: 4.625rem;
  }
  .logheader .act {
    color: #fff;
    font-size: 0.6875rem;
    font-weight: 700;
  }
  .logtime {
    font-weight: 700;
    color: var(--accent);
    min-width: 3.25rem;
    font-size: 0.875rem;
    padding-top: 0.125rem;
    border-right: 0.0625rem solid var(--line);
    padding-right: 0.75rem;
  }
  .logtime.wide {
    min-width: 4.625rem;
    font-size: 0.75rem;
    line-height: 1.4;
  }
  .logbody {
    flex: 1;
    min-width: 0;
  }
  .logitem:not(.logheader) {
    align-items: center;
    padding: 0.625rem 0.25rem;
    cursor: pointer;
    border-radius: var(--r-sm);
  }
  .logheader + .logitem {
    border-top: none;
  }
  .logitem:not(.logheader):active {
    background: var(--chip);
  }
  .logitem .chev {
    flex: none;
    color: var(--sub);
    font-size: 1.5rem;
    line-height: 1;
    padding: 0 0.25rem;
  }
  .logitem .kg {
    font-size: 1.0625rem;
    font-weight: 700;
    margin-right: 0.5rem;
  }
  .logitem .diff {
    font-size: 0.8125rem;
    color: var(--sub);
    font-weight: 400;
  }
  .logitem .a.none {
    color: var(--txt);
    font-weight: 700;
  }
  .logbody .act {
    font-weight: 600;
  }
  .logbody .note {
    color: var(--sub);
    font-size: 0.8125rem;
    margin-top: 0.125rem;
    white-space: pre-wrap;
  }
  .mini {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 0.8125rem;
    cursor: pointer;
    padding: 0.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-sm);
  }
  .mini:hover, .mini:active {
    background: var(--chip);
  }
  .mini.del {
    color: var(--txt);
  }
  .datebar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .datebar input {
    flex: 1;
    min-width: 0;
  }
  .navbtn {
    width: 2.5rem;
    flex: none;
    padding: 0.625rem 0;
    border: 0.0625rem solid var(--line);
    background: #fff;
    border-radius: var(--r-sm);
    font-size: 1rem;
    cursor: pointer;
  }
  .empty {
    color: var(--sub);
    text-align: center;
    padding: 1rem 0;
    font-size: 0.875rem;
  }
  .wmeta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }
  .wbig {
    font-size: 1.875rem;
    font-weight: 800;
    color: var(--accent);
  }
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: #fff;
    border-top: 0.0625rem solid var(--line);
    z-index: 6;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1;
    border: none;
    background: none;
    padding: 0.5rem 0 0.5rem;
    font-size: 0.6875rem;
    color: var(--sub);
    cursor: pointer;
  }
  nav button .ic {
    display: flex;
    justify-content: center;
    line-height: 1.2;
  }
  nav button .ic svg {
    width: 1.25rem;
    height: 1.25rem;
  }
  nav button.on {
    color: var(--accent);
    font-weight: 700;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 5.25rem;
    transform: translateX(-50%);
    background: #1f2d3d;
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: var(--r-full);
    font-size: 0.875rem;
    opacity: 0;
    transition: opacity .25s;
    z-index: 20;
    pointer-events: none;
  }
  .toast.show {
    opacity: .95;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 1rem;
  }
  .modal.show {
    display: flex;
  }
  .modal .box {
    background: #fff;
    border-radius: var(--r-md);
    padding: 1rem;
    width: 100%;
    max-width: 26.25rem;
  }
  .modal h3 {
    margin: 0 0 0.5rem;
    font-size: 1rem;
  }
  #modal-log h3 {
    border-left: 0.1875rem solid var(--accent);
    padding-left: 0.5rem;
  }
  .spinner {
    text-align: center;
    color: var(--sub);
    padding: 1.5rem;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
<header> PW手帳 <small id="hd-sub"></small></header>

<!-- 記録 -->
<section id="view-log" class="view active">
  <div class="card">
    <h2>日時</h2>
    <label>日付</label>
    <input type="date" id="log-date">
    <label>時刻</label>
    <div class="row" style="gap:0.5rem;">
      <select id="log-hour"></select>
      <select id="log-min"></select>
    </div>
  </div>
  <div class="card">
    <h2>内容</h2>
    <label>ショートカット</label>
    <div class="chips" id="presets"></div>
    <label>やったこと</label>
    <div style="position:relative;">
      <input type="text" id="log-action" placeholder="例：ワン、ごはん など" style="padding-right:2.5rem;">
      <button type="button" class="mini" id="btn-clear-action" aria-label="クリア" title="クリア" style="position:absolute;top:50%;right:0.25rem;transform:translateY(-50%);"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <label>備考（任意）</label>
    <div style="position:relative;">
      <textarea id="log-note" placeholder="例：初めての場所で夢中作りできた！" style="padding-right:2.5rem;"></textarea>
      <button type="button" class="mini" id="btn-clear-note" aria-label="クリア" title="クリア" style="position:absolute;top:0.375rem;right:0.25rem;"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <button class="btn" id="btn-save">この内容で記録する</button>
  </div>
  <div class="card">
    <h2>最近の記録（直近20件）</h2>
    <div id="today-list"><div class="spinner">読み込み中…</div></div>
  </div>
</section>

<!-- 一覧 -->
<section id="view-list" class="view">
  <div class="card">
    <div class="chips" id="list-mode" style="margin-bottom:0.625rem;">
      <div class="chip on" data-mode="day">日付</div>
      <div class="chip" data-mode="range">期間</div>
      <div class="chip" data-mode="all">全期間</div>
    </div>

    <div class="datebar" id="list-day-controls">
      <button class="navbtn" id="d-prev">‹</button>
      <input type="date" id="list-date">
      <button class="navbtn" id="d-next">›</button>
    </div>

    <div id="list-range-controls" style="display:none;">
      <label>開始日</label>
      <input type="date" id="list-from">
      <label>終了日</label>
      <input type="date" id="list-to">
    </div>
  </div>
  <div class="card">
    <div style="position:relative;">
      <input type="text" id="list-search" placeholder="キーワードで絞り込み" style="padding-right:2.5rem;">
      <button type="button" class="mini" id="btn-clear-search" aria-label="クリア" title="クリア" style="position:absolute;top:50%;right:0.25rem;transform:translateY(-50%);"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <div id="list-area" style="margin-top:1rem;"><div class="spinner">読み込み中…</div></div>
  </div>
</section>

<!-- 体重 -->
<section id="view-weight" class="view">
  <div class="card">
    <div class="wmeta"><h2 style="margin:0;">体重の推移</h2><div style="text-align:right;"><div><span class="wbig" id="w-latest">–</span> kg</div><div id="w-latest-diff" style="font-size:0.8125rem;color:var(--sub);"></div></div></div>
    <canvas id="w-chart" height="220"></canvas>
    <div style="font-size:0.75rem;color:var(--sub);margin-top:0.5rem;">グラフのどこかをタップすると、その日の体重が表示されます</div>
  </div>
  <div class="card">
    <h2>一覧</h2>
    <div style="font-size:0.75rem;color:var(--sub);margin:-0.25rem 0 0.5rem;">行をタップすると編集・削除できます</div>
    <div id="w-list"><div class="spinner">読み込み中…</div></div>
    <button class="btn ghost" id="w-more" style="margin-top:0.5rem;display:none;">さらに表示</button>
  </div>
  <div class="card">
    <h2>体重を記録</h2>
    <label>計測日</label>
    <input type="date" id="w-date">
    <label>体重(kg)</label>
    <div style="position:relative;">
      <input type="number" id="w-kg" step="0.01" inputmode="decimal" placeholder="例：26.5" style="padding-right:2.5rem;">
      <button type="button" class="mini" id="btn-clear-wkg" aria-label="クリア" title="クリア" style="position:absolute;top:50%;right:0.25rem;transform:translateY(-50%);"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <label>備考（任意）</label>
    <div style="position:relative;">
      <input type="text" id="w-note" style="padding-right:2.5rem;">
      <button type="button" class="mini" id="btn-clear-wnote" aria-label="クリア" title="クリア" style="position:absolute;top:50%;right:0.25rem;transform:translateY(-50%);"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <button class="btn" id="btn-wsave">体重を記録する</button>
  </div>
</section>

<!-- 質問 -->
<section id="view-qa" class="view">
  <div class="card">
    <h2>協会への質問を追加</h2>
    <div style="position:relative;">
      <textarea id="qa-new" placeholder="聞きたいことを入力" style="padding-right:2.5rem;"></textarea>
      <button type="button" class="mini" id="btn-clear-qanew" aria-label="クリア" title="クリア" style="position:absolute;top:0.375rem;right:0.25rem;"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <button class="btn" id="btn-qadd">質問を追加する</button>
  </div>
  <div class="card">
    <h2>質問リスト</h2>
    <div id="qa-area"><div class="spinner">読み込み中…</div></div>
  </div>
</section>

<nav>
  <button class="on" data-v="log"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></span>記録</button>
  <button data-v="list"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>一覧</button>
  <button data-v="weight"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v4l3 2"/></svg></span>体重</button>
  <button data-v="qa"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9-.7c0 1.7-2.4 1.9-2.4 3.7"/><line x1="12" y1="16.5" x2="12.01" y2="16.5"/></svg></span>質問</button>
</nav>

<div class="toast" id="toast"></div>

<!-- 記録編集モーダル -->
<div class="modal" id="modal-log">
  <div class="box">
    <h3>記録を編集</h3>
    <label>時刻</label>
    <div class="row" style="gap:0.5rem;">
      <select id="m-hour"></select>
      <select id="m-min"></select>
    </div>
    <label>ショートカット</label>
    <div class="chips" id="m-presets"></div>
    <label>やったこと</label>
    <div style="position:relative;">
      <input type="text" id="m-act" style="padding-right:2.5rem;">
      <button type="button" class="mini" id="btn-clear-mact" aria-label="クリア" title="クリア" style="position:absolute;top:50%;right:0.25rem;transform:translateY(-50%);"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <label>備考</label>
    <div style="position:relative;">
      <textarea id="m-note" style="padding-right:2.5rem;"></textarea>
      <button type="button" class="mini" id="btn-clear-mnote" aria-label="クリア" title="クリア" style="position:absolute;top:0.375rem;right:0.25rem;"><svg viewBox="0 0 24 24" style="width:1.375rem;height:1.375rem;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <button class="btn" id="m-save">保存</button>
    <button class="btn danger" id="m-del" style="margin-top:0.5rem;">削除</button>
    <button class="btn ghost" id="m-cancel" style="margin-top:0.5rem;">キャンセル</button>
  </div>
</div>

<!-- 回答編集モーダル -->
<div class="modal" id="modal-qa">
  <div class="box">
    <h3>質問を編集 <span id="mq-no" style="color:var(--accent);font-size:0.8125rem;"></span></h3>
    <label>質問</label>
    <div style="position:relative;">
      <textarea id="mq-q" style="padding-right:2.5rem;"></textarea>

<script>
/* ---------- google.script.run を Promise 化 ---------- */
function call(fn){
  const args = Array.prototype.slice.call(arguments,1);
  return new Promise((resolve,reject)=>{
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    runner[fn].apply(runner,args);
  });
}
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toInputDate(ymd){return String(ymd||'').replace(/\//g,'-');}      // 2025/05/22 -> 2025-05-22
function fromInputDate(s){return String(s||'').replace(/-/g,'/');}         // 2025-05-22 -> 2025/05/22
function stripHour(t){const m=String(t).match(/^0(\d:\d{2})$/);return m?m[1]:t;}

/* ---------- ボタンの押下フィードバック（通信を伴うボタン共通） ----------
 * 押す → スピナー付きで「〜中…」(連打できない) → 成功したら緑の「〜しました ✓」を少し見せる → 元に戻る。
 * task は成功なら true、失敗なら false を返す関数（失敗時のtoastはtask側で出す）。
 * lockBtns には、通信中に押されると困る同じ画面内の他ボタン（モーダルの削除/キャンセルなど）を渡す。
 * 戻り値は成功したかどうか。モーダルを閉じる等の後処理は、完了表示のあとに呼び出し側で行う。 */
async function runWithButton(btn, labels, task, lockBtns){
  const orig = btn.textContent;
  const locks = (lockBtns||[]).filter(b=>b && !b.disabled);
  locks.forEach(b=>{ b.disabled = true; });
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = labels.loading;
  let ok = false;
  try{
    ok = await task();
  }catch(e){
    toast('エラー：'+(e.message||e));
  }
  btn.classList.remove('loading');
  if(ok){
    btn.classList.add('success');
    btn.textContent = labels.done;
    await new Promise(r=>setTimeout(r, 800));
    btn.classList.remove('success');
  }
  btn.textContent = orig;
  btn.disabled = false;
  locks.forEach(b=>{ b.disabled = false; });
  return ok;
}

let INIT=null;

/* ---------- 「やったこと」欄 ⇔ チップ 同期まわり ----------
 * 記録タブの新規入力欄（#log-action）・一覧タブの編集モーダル（#m-act）など、
 * 複数の入力欄で同じチップ機能を使い回せるよう、対象欄(inputEl)を引数で受け取る。
 * 省略時は #log-action を対象にする（記録タブでの既存の呼び出し方はそのまま動く）。 */
/** 対象欄の中身を「、」区切りの配列にする（同じ項目が複数回あってもOK） */
function currentActionList(inputEl){
  inputEl = inputEl || $('#log-action');
  return inputEl.value.split('、').map(s=>s.trim()).filter(Boolean);
}
/** 配列を「、」区切りで対象欄へ反映 */
function setActionList(list, inputEl){
  inputEl = inputEl || $('#log-action');
  inputEl.value = list.join('、');
}
/** チップをタップ: 常に対象欄の末尾に追加する（同じ項目を何度選んでもOK・制限なし） */
function addToActionText(name, inputEl){
  inputEl = inputEl || $('#log-action');
  const list = currentActionList(inputEl);
  list.push(name);
  setActionList(list, inputEl);
  inputEl.classList.remove('invalid');
}
/** タップした瞬間だけチップを緑色に光らせる（同じ項目を何度でも選べる仕様のため、
 *  「選択中」を表す常時ON表示はせず、押した合図としてのフラッシュのみ行う） */
function flashChip(chipEl){
  chipEl.classList.add('on');
  clearTimeout(chipEl._flashTimer);
  chipEl._flashTimer = setTimeout(()=>{ chipEl.classList.remove('on'); }, 220);
}
/** プリセットのショートカットチップ群を container に生成し、タップで targetInput に追記する。
 *  記録タブの新規入力欄・一覧タブの編集モーダルの両方から共通で呼び出す。 */
function buildPresetChips(container, targetInput){
  container.innerHTML = '';
  INIT.presets.forEach(name=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent=name;
    c.addEventListener('click',()=>{
      if(durationMax(name)!==undefined){
        openMinuteDialog(name, c, targetInput);
      }else{
        addToActionText(name, targetInput);
        flashChip(c);
      }
    });
    container.appendChild(c);
  });
}

/* ---------- 分数入力が必要なプリセット ---------- */
// 分数を聞くショートカット名 → 最大分（5分刻み）。スプレッドシートの「ショートカット」シートの内容が
// getInit() の durations で渡ってくる。古いバックエンド（durations なし）の場合は下の既定値を使う。
const DEFAULT_DURATIONS = { '散歩':120, '夢中作り':60, '仰向け抱っこ':60 };
function durationMax(name){
  const d = (INIT && INIT.durations) || DEFAULT_DURATIONS;
  return Object.prototype.hasOwnProperty.call(d, name) ? (d[name] || 60) : undefined;
}

/** name の分数選択ダイアログを開く。OKで「name(◯分)」の形を targetInput（省略時は #log-action）に追加する */
function openMinuteDialog(name, chipEl, targetInput){
  targetInput = targetInput || $('#log-action');
  $('#mm-title').textContent = name + 'は何分？';

  const max = durationMax(name) || 60;
  let opts = '<option value="">指定なし</option>';
  for (let m = 5; m <= max; m += 5) opts += `<option value="${m}">${m}分</option>`;
  $('#mm-min').innerHTML = opts;

  $('#modal-min').classList.add('show');

  $('#mm-ok').onclick = ()=>{
    const mins = $('#mm-min').value;
    const label = mins ? `${name}(${mins}分)` : `${name}(分)`;
    addToActionText(label, targetInput);
    if(chipEl) flashChip(chipEl);
    $('#modal-min').classList.remove('show');
  };
}
$('#mm-cancel').addEventListener('click', ()=>$('#modal-min').classList.remove('show'));

/* ---------- 起動 ---------- */
window.addEventListener('load', async ()=>{
  try{
    INIT = await call('getInit');
  }catch(e){ document.body.innerHTML='<p style="padding:1.25rem">読み込みに失敗しました：'+esc(e.message||e)+'</p>'; return; }

  // 日付・時刻の初期値
  $('#log-date').value = toInputDate(INIT.today);
  fillTimeSelects(); setLogTimeNow();
  $('#list-date').value = toInputDate(INIT.today);
  $('#w-date').value = toInputDate(INIT.today);

  // プリセットチップ（タップするたびに対象欄の末尾に追加。何度でも選択可）
  // 記録タブの新規入力欄と、一覧タブの編集モーダルの両方に同じチップ群を用意する
  buildPresetChips($('#presets'), $('#log-action'));
  buildPresetChips($('#m-presets'), $('#m-act'));

  bindNav(); bindLog(); bindList(); bindWeight(); bindQA();
  loadToday();
});

/* ---------- ナビ切替 ---------- */
function bindNav(){
  $$('nav button').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('nav button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const v=b.dataset.v;
      $$('.view').forEach(x=>x.classList.remove('active'));
      $('#view-'+v).classList.add('active');
      if(v==='list') loadList();
      if(v==='weight') loadWeight();
      if(v==='qa') loadQA();
    });
  });
}

/* ---------- 記録タブ ---------- */
function bindLog(){
  // 入力し始めたらエラー表示を解除
  $('#log-action').addEventListener('input', ()=>$('#log-action').classList.remove('invalid'));

  // 「やったこと」欄をクリア（.focus()を呼ぶとiOS Safariでキーボードが開いてしまうため呼ばない）
  $('#btn-clear-action').addEventListener('click', ()=>{
    $('#log-action').value='';
    $('#log-action').classList.remove('invalid');
  });

  // 「備考」欄をクリア
  $('#btn-clear-note').addEventListener('click', ()=>{
    $('#log-note').value='';
  });

  $('#btn-save').addEventListener('click', async ()=>{
    const btn=$('#btn-save');
    const actionText = $('#log-action').value.trim();

    // 「やったこと」未入力ならサーバーに送らずその場でエラー表示
    if(!actionText){
      $('#log-action').classList.add('invalid');
      $('#log-action').focus();
      toast('「やったこと」を入力してください');
      return;
    }

    const payload={
      date: fromInputDate($('#log-date').value),
      time: getLogTimeStr(),
      action: actionText,
      note: $('#log-note').value.trim()
    };
    await runWithButton(btn, {loading:'記録中…', done:'記録しました ✓'}, async ()=>{
      const r=await call('addLog',payload);
      if(!r.ok){ toast(r.error||'失敗しました'); return false; }
      toast('✅ 記録しました');
      $('#log-action').value=''; $('#log-note').value='';
      setLogTimeNow();
      loadToday();
      return true;
    });
  });
}
function pad2(n){return ('0'+n).slice(-2);}
/* 今の時刻を10分単位に丸める（分の1の位: 0〜4は切り下げ / 5〜9は切り上げ）。
 * 23:5x → 翌日0:00 のように日付をまたぐ場合は rolloverToNextDay=true を返す */
function timeNowRounded(){
  const d=new Date();
  let h=d.getHours(), m=Math.round(d.getMinutes()/10)*10;
  let rolloverToNextDay=false;
  if(m===60){
    m=0;
    if(h===23){ h=0; rolloverToNextDay=true; }
    else{ h=h+1; }
  }
  return {h,m,rolloverToNextDay};
}
/** 時（0〜23時）・分（10分刻み）のセレクトを作る。記録タブ(#log-hour/#log-min)と編集モーダル(#m-hour/#m-min)で共通 */
function fillHourMinSelects(hourEl, minEl){
  let oh=''; for(let i=0;i<24;i++) oh+='<option value="'+i+'">'+i+'時</option>';
  hourEl.innerHTML=oh;
  let om=''; for(let i=0;i<60;i+=10) om+='<option value="'+i+'">'+pad2(i)+'分</option>';
  minEl.innerHTML=om;
}
function fillTimeSelects(){
  fillHourMinSelects($('#log-hour'), $('#log-min'));
  fillHourMinSelects($('#m-hour'), $('#m-min'));
}
/** 編集モーダルのセレクトに 'H:mm' / 'HH:mm' を反映する。10分刻みに無い分（過去の記録など）は選択肢を足して保持する */
function setModalTime(timeStr){
  const m=String(timeStr).match(/(\d{1,2}):(\d{2})/);
  const h=m?Number(m[1]):0, mi=m?Number(m[2]):0;
  $('#m-hour').value=String(h);
  const minEl=$('#m-min');
  if(!Array.prototype.some.call(minEl.options, o=>Number(o.value)===mi)){
    const opt=document.createElement('option');
    opt.value=String(mi); opt.textContent=pad2(mi)+'分';
    // 値の昇順になる位置へ差し込む
    const after=Array.prototype.find.call(minEl.options, o=>Number(o.value)>mi);
    minEl.insertBefore(opt, after||null);
  }
  minEl.value=String(mi);
}
function getModalTimeStr(){return $('#m-hour').value+':'+pad2(Number($('#m-min').value));}
function setLogTimeNow(){
  const t=timeNowRounded();
  $('#log-hour').value=String(t.h);
  $('#log-min').value=String(t.m);
  // 日付をまたいだ場合は日付欄も翌日に進める（そうしないと時刻だけ0:00に戻り日付は前日のままになる）
  if(t.rolloverToNextDay){
    const nd=new Date(); nd.setDate(nd.getDate()+1);
    $('#log-date').value = nd.getFullYear()+'-'+pad2(nd.getMonth()+1)+'-'+pad2(nd.getDate());
  }
}
function getLogTimeStr(){return $('#log-hour').value+':'+pad2(Number($('#log-min').value));}
/* 10分区切りに丸める（分の1の位：0〜4は切り下げ、5〜9は切り上げ）。例 17:53→17:50, 17:55→18:00 */
function round10(hhmm){
  const m0=String(hhmm).match(/(\d{1,2}):(\d{2})/); if(!m0) return hhmm;
  let h=Number(m0[1]), m=Number(m0[2]);
  const last=m%10;
  m = (last<=4) ? (m-last) : (m-last+10);
  if(m>=60){m=0;h=(h+1)%24;}
  return ('0'+h).slice(-2)+':'+('0'+m).slice(-2);
}

async function loadToday(){
  const wrap=$('#today-list'); wrap.innerHTML='<div class="spinner">読み込み中…</div>';
  try{
    // 日付の条件なしで、最新の記録を新しい順に20件だけ取得する
    const logs=await call('getRecentLogs', 20);
    wrap.innerHTML = renderLogs(logs, true); // 複数日にまたがるので日付も表示
    bindLogItemButtons(wrap, ()=>loadToday());
  }catch(e){wrap.innerHTML='<div class="empty">読み込み失敗：'+esc(e.message||e)+'</div>';}
}

/* ---------- 一覧タブ ---------- */
let listMode = 'day'; // 'day' | 'range' | 'all'

function bindList(){
  $$('#list-mode .chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      listMode = c.dataset.mode;
      $$('#list-mode .chip').forEach(x=>x.classList.toggle('on', x===c));
      if(listMode==='range'){
        // 初回切替時は「日付」タブで見ていた日を初期値に入れておく
        if(!$('#list-from').value) $('#list-from').value = $('#list-date').value || toInputDate(INIT.today);
        if(!$('#list-to').value)   $('#list-to').value   = $('#list-date').value || toInputDate(INIT.today);
      }
      $('#list-day-controls').style.display   = (listMode==='day')   ? 'flex'  : 'none';
      $('#list-range-controls').style.display = (listMode==='range') ? 'block' : 'none';
      loadList();
    });
  });
  $('#list-date').addEventListener('change', loadList);
  $('#list-from').addEventListener('change', loadList);
  $('#list-to').addEventListener('change', loadList);
  $('#d-prev').addEventListener('click', ()=>shiftDate(-1));
  $('#d-next').addEventListener('click', ()=>shiftDate(1));
  // キーワード検索はサーバーに問い合わせ直さず、直近取得した一覧をその場で絞り込む
  $('#list-search').addEventListener('input', renderFilteredList);
  // 検索欄をクリア
  $('#btn-clear-search').addEventListener('click', ()=>{
    $('#list-search').value='';
    renderFilteredList();
  });
}
function shiftDate(delta){
  const v=$('#list-date').value; if(!v) return;
  const d=new Date(v+'T00:00:00'); d.setDate(d.getDate()+delta);
  // toISOString()はUTC変換されるためJSTなど+offset環境だと日付がずれる。
  // ローカルの年月日をそのまま組み立てる。
  $('#list-date').value = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  loadList();
}
let listReqId = 0; // 直近のリクエストだけを表示に反映するためのガード
let listLogsCache = []; // 直近取得した一覧（検索フィルタはこれをその場で絞り込む）
async function loadList(){
  const myReq = ++listReqId;
  const wrap=$('#list-area'); wrap.innerHTML='<div class="spinner">読み込み中…</div>';
  try{
    let from='', to='';
    if(listMode==='day'){
      from = to = fromInputDate($('#list-date').value);
    }else if(listMode==='range'){
      from = $('#list-from').value ? fromInputDate($('#list-from').value) : '';
      to   = $('#list-to').value   ? fromInputDate($('#list-to').value)   : '';
    } // 'all' の場合は from/to とも空のまま＝全期間

    const logs = await call('getLogsRange', from, to);
    if(myReq !== listReqId) return; // 後から発行された別のリクエストがある場合、この古い結果は捨てる
    listLogsCache = logs;
    renderFilteredList();
  }catch(e){
    if(myReq !== listReqId) return;
    wrap.innerHTML='<div class="empty">読み込み失敗：'+esc(e.message||e)+'</div>';
  }
}

/** #list-search の入力内容で listLogsCache を絞り込んで表示する（サーバー通信なし） */
function renderFilteredList(){
  const wrap = $('#list-area');
  const q = $('#list-search').value.trim();
  const filtered = q
    ? listLogsCache.filter(l => (String(l.action||'') + '　' + String(l.note||'')).includes(q))
    : listLogsCache;
  const emptyMsg = q ? '「'+esc(q)+'」に一致する記録がありません' : undefined;
  wrap.innerHTML = renderLogs(filtered, listMode !== 'day', emptyMsg);
  bindLogItemButtons(wrap, ()=>loadList());
}

function renderLogs(logs, showDate, emptyMsg){
  const header = `
    <div class="logitem logheader">
      <div class="logtime${showDate?' wide':''}">${showDate ? '日付' : '時刻'}</div>
      <div class="logbody"><div class="act">やったこと・備考</div></div>
    </div>`;
  if(!logs.length) return header + '<div class="empty">'+(emptyMsg || '記録がありません')+'</div>';
  return header + logs.map(l=>`
    <div class="logitem" data-id="${esc(l.id)}" data-time="${esc(l.time)}" data-act="${esc(l.action)}" data-note="${esc(l.note)}">
      <div class="logtime${showDate?' wide':''}">${showDate ? esc(l.date.slice(5))+'('+esc(l.dow)+')<br>'+esc(l.time) : esc(l.time)}</div>
      <div class="logbody">
        <div class="act">${esc(l.action)}</div>
        ${l.note?`<div class="note">${esc(l.note)}</div>`:''}
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </div>`).join('');
}

let editingId=null;
function bindLogItemButtons(wrap, reload){
  wrap.querySelectorAll('.logitem:not(.logheader)').forEach(item=>{
    const id=item.dataset.id;
    const time=item.dataset.time || '';
    const act=item.dataset.act || '';
    const note=item.dataset.note || '';
    item.addEventListener('click',()=>{
      editingId=id;
      setModalTime(time);
      $('#m-act').value=act; $('#m-note').value=note;
      $('#modal-log').classList.add('show');
      // 通信中は同じモーダル内の他ボタンを押せないようにし、失敗時はモーダルを開いたままにして再試行できるようにする
      const modalBtns=()=>[$('#m-save'), $('#m-del'), $('#m-cancel')];
      $('#m-save').onclick=async ()=>{
        const btn=$('#m-save');
        const ok=await runWithButton(btn, {loading:'保存中…', done:'保存しました ✓'}, async ()=>{
          const r=await call('updateLog', id, {time:getModalTimeStr(), action:$('#m-act').value, note:$('#m-note').value});
          if(!r.ok){ toast(r.error||'失敗'); return false; }
          return true;
        }, modalBtns().filter(b=>b!==btn));
        if(ok){ $('#modal-log').classList.remove('show'); toast('更新しました'); reload(); }
      };
      // 削除は編集モーダル内のボタンから行う（一覧側にはアイコンを出さない）
      $('#m-del').onclick=async ()=>{
        if(!confirm('この記録を削除しますか？\n'+time+' '+act)) return;
        const btn=$('#m-del');
        const ok=await runWithButton(btn, {loading:'削除中…', done:'削除しました ✓'}, async ()=>{
          const r=await call('deleteLog', id);
          if(!r.ok){ toast(r.error||'失敗'); return false; }
          return true;
        }, modalBtns().filter(b=>b!==btn));
        if(ok){ $('#modal-log').classList.remove('show'); toast('削除しました'); reload(); }
      };
    });
  });
}
$('#m-cancel').addEventListener('click',()=>$('#modal-log').classList.remove('show'));
// 編集モーダルの「やったこと」「備考」を一括クリア（記録タブと同じ。.focus()はiOSでキーボードが開くので呼ばない）
$('#btn-clear-mact').addEventListener('click', ()=>{ $('#m-act').value=''; });
$('#btn-clear-mnote').addEventListener('click', ()=>{ $('#m-note').value=''; });

/* ---------- 体重タブ ---------- */
let wChart=null;
let WDATA=[];          // 日付昇順の体重データ（各要素: {date, kg, note, row}）
let wShown=10;         // 一覧に表示する件数（「さらに表示」で増やす）
const WDOW=['日','月','火','水','木','金','土'];
function fmtDiff(d){
  const v=Math.round(d*100)/100;
  return (v>0?'＋':v<0?'−':'±')+Math.abs(v).toFixed(2)+'kg';
}
function wDateLabel(dateStr){
  const m=String(dateStr).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(!m) return dateStr;
  const dt=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  return m[1]+'/'+pad2(Number(m[2]))+'/'+pad2(Number(m[3]))+'('+WDOW[dt.getDay()]+')';
}
/** 一覧用の短い日付（MM/dd(曜) の下に年） */
function wDateShort(dateStr){
  const m=String(dateStr).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(!m) return esc(dateStr);
  const dt=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  return pad2(Number(m[2]))+'/'+pad2(Number(m[3]))+'('+WDOW[dt.getDay()]+')<br>'+m[1];
}
function bindWeight(){
  $('#btn-wsave').addEventListener('click', async ()=>{
    const btn=$('#btn-wsave');
    await runWithButton(btn, {loading:'記録中…', done:'記録しました ✓'}, async ()=>{
      const r=await call('addWeight',{date:fromInputDate($('#w-date').value), kg:$('#w-kg').value, note:$('#w-note').value.trim()});
      if(!r.ok){ toast(r.error||'失敗'); return false; }
      toast('記録しました'); $('#w-kg').value=''; $('#w-note').value=''; loadWeight();
      return true;
    });
  });
  // 体重・備考欄をクリア
  $('#btn-clear-wkg').addEventListener('click', ()=>{ $('#w-kg').value=''; });
  $('#btn-clear-wnote').addEventListener('click', ()=>{ $('#w-note').value=''; });

  // 一覧の「さらに表示」
  $('#w-more').addEventListener('click', ()=>{ wShown+=20; renderWeightList(); });

  // 編集モーダル
  $('#btn-clear-mwkg').addEventListener('click', ()=>{ $('#mw-kg').value=''; });
  $('#btn-clear-mwnote').addEventListener('click', ()=>{ $('#mw-note').value=''; });
  $('#mw-cancel').addEventListener('click', ()=>$('#modal-weight').classList.remove('show'));
}
/** 一覧（新しい日付が上）を描画。タップで編集モーダルを開く */
function renderWeightList(){
  const wrap=$('#w-list'), more=$('#w-more');
  if(!WDATA.length){ wrap.innerHTML='<div class="empty">体重の記録がありません</div>'; more.style.display='none'; return; }
  const rows=WDATA.map((d,i)=>({d, prev:i>0?WDATA[i-1]:null})).reverse();
  const shown=rows.slice(0,wShown);
  const header=`
    <div class="logitem logheader">
      <div class="logtime wide">日付</div>
      <div class="logbody"><div class="act">体重（前回比）・備考</div></div>
    </div>`;
  wrap.innerHTML=header+shown.map(({d,prev})=>`
    <div class="logitem witem" data-row="${esc(d.row)}">
      <div class="logtime wide">${wDateShort(d.date)}</div>
      <div class="logbody">
        <div class="act"><span class="kg">${esc(d.kg)} kg</span>${prev?`<span class="diff">${esc(fmtDiff(d.kg-prev.kg))}</span>`:''}</div>
        ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </div>`).join('');
  more.style.display = rows.length>shown.length ? '' : 'none';
  wrap.querySelectorAll('.witem').forEach(el=>{
    el.addEventListener('click',()=>{
      const item=WDATA.find(x=>String(x.row)===el.dataset.row);
      if(item) openWeightModal(item);
    });
  });
}
function openWeightModal(item){
  $('#mw-date').value=toInputDate(item.date);
  $('#mw-kg').value=item.kg;
  $('#mw-note').value=item.note||'';
  $('#modal-weight').classList.add('show');
  const modalBtns=()=>[$('#mw-save'), $('#mw-del'), $('#mw-cancel')];
  const expect={date:item.date, kg:item.kg};   // 行ずれ防止：サーバー側で元の値と一致するか確認する
  $('#mw-save').onclick=async ()=>{
    const btn=$('#mw-save');
    const ok=await runWithButton(btn, {loading:'保存中…', done:'保存しました ✓'}, async ()=>{
      const r=await call('updateWeight', item.row, {date:fromInputDate($('#mw-date').value), kg:$('#mw-kg').value, note:$('#mw-note').value.trim()}, expect);
      if(!r.ok){ toast(r.error||'失敗'); return false; }
      return true;
    }, modalBtns().filter(b=>b!==btn));
    if(ok){ $('#modal-weight').classList.remove('show'); toast('更新しました'); loadWeight(); }
  };
  $('#mw-del').onclick=async ()=>{
    if(!confirm('この体重の記録を削除しますか？\n'+wDateLabel(item.date)+'  '+item.kg+'kg')) return;
    const btn=$('#mw-del');
    const ok=await runWithButton(btn, {loading:'削除中…', done:'削除しました ✓'}, async ()=>{
      const r=await call('deleteWeight', item.row, expect);
      if(!r.ok){ toast(r.error||'失敗'); return false; }
      return true;
    }, modalBtns().filter(b=>b!==btn));
    if(ok){ $('#modal-weight').classList.remove('show'); toast('削除しました'); loadWeight(); }
  };
}
async function loadWeight(){
  try{
    const data=await call('getWeights');
    WDATA=data;
    if(data.length){
      $('#w-latest').textContent=data[data.length-1].kg;
      $('#w-latest-diff').textContent = data.length>1 ? '前回比 '+fmtDiff(data[data.length-1].kg-data[data.length-2].kg) : '';
    }else{
      $('#w-latest').textContent='–'; $('#w-latest-diff').textContent='';
    }
    renderWeightList();
    const labels=data.map(d=>d.date.slice(5)); // MM/dd
    const vals=data.map(d=>d.kg);
    if(wChart) wChart.destroy();
    wChart=new Chart($('#w-chart').getContext('2d'),{
      type:'line',
      data:{labels,datasets:[{label:'体重(kg)',data:vals,borderColor:'#1f2d3d',
            backgroundColor:'rgba(31,45,61,.08)',fill:true,tension:.25,
            pointRadius:4,pointHoverRadius:7,pointHitRadius:24}]},
      options:{responsive:true,
               // 点そのものを狙わなくても、タップした位置に一番近い日のデータが出る
               interaction:{mode:'nearest',axis:'x',intersect:false},
               plugins:{legend:{display:false},
                        tooltip:{padding:12,titleFont:{size:14},bodyFont:{size:15},
                                 callbacks:{
                                   title:items=>items.length?wDateLabel(data[items[0].dataIndex].date):'',
                                   label:c=>{
                                     const i=c.dataIndex;
                                     const prev=i>0?'（前回比 '+fmtDiff(data[i].kg-data[i-1].kg)+'）':'';
                                     return c.parsed.y+' kg'+prev;
                                   },
                                   afterLabel:c=>data[c.dataIndex].note||''
                                 }}},
               scales:{y:{beginAtZero:false}}}
    });
  }catch(e){toast('体重の読込失敗：'+(e.message||e));}
}

/* ---------- 質問タブ ---------- */
function bindQA(){
  $('#btn-qadd').addEventListener('click', async ()=>{
    const q=$('#qa-new').value.trim(); if(!q){toast('質問を入力してください');return;}
    const btn=$('#btn-qadd');
    await runWithButton(btn, {loading:'追加中…', done:'追加しました ✓'}, async ()=>{
      const r=await call('addQA',{q});
      if(!r.ok){ toast(r.error||'失敗'); return false; }
      toast('追加しました'); $('#qa-new').value=''; loadQA();
      return true;
    });
  });
  $('#mq-cancel').addEventListener('click',()=>$('#modal-qa').classList.remove('show'));
  // 質問入力欄をクリア
  $('#btn-clear-qanew').addEventListener('click', ()=>{ $('#qa-new').value=''; });
  // 編集モーダルの質問・回答欄をクリア
  $('#btn-clear-mq').addEventListener('click', ()=>{ $('#mq-q').value=''; });
  $('#btn-clear-mqa').addEventListener('click', ()=>{ $('#mq-a').value=''; });
}
async function loadQA(){
  const wrap=$('#qa-area'); wrap.innerHTML='<div class="spinner">読み込み中…</div>';
  try{
    const list=await call('getQA');
    const header=`
      <div class="logitem logheader">
        <div class="logtime">No.</div>
        <div class="logbody"><div class="act">質問・回答</div></div>
      </div>`;
    if(!list.length){wrap.innerHTML=header+'<div class="empty">質問がありません</div>'; return;}
    wrap.innerHTML=header+list.map(x=>`
      <div class="logitem qa" data-no="${esc(x.no)}">
        <div class="logtime">${esc(x.no)}</div>
        <div class="logbody">
          <div class="act">${esc(x.q)}</div>
          <div class="note a ${x.a?'':'none'}">${x.a?esc(x.a):'未回答（タップで編集・回答）'}</div>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </div>`).join('');
    wrap.querySelectorAll('.qa').forEach(el=>{
      el.addEventListener('click',()=>{
        const no=el.dataset.no;
        const item=list.find(y=>String(y.no)===String(no));
        $('#mq-no').textContent='No.'+no;
        $('#mq-q').value=item.q;
        $('#mq-a').value=item.a||'';
        $('#modal-qa').classList.add('show');
        const modalBtns=()=>[$('#mq-save'), $('#mq-del'), $('#mq-cancel')];
        $('#mq-save').onclick=async ()=>{
          const q=$('#mq-q').value.trim();
          if(!q){ toast('質問を入力してください'); return; }
          const btn=$('#mq-save');
          const ok=await runWithButton(btn, {loading:'保存中…', done:'保存しました ✓'}, async ()=>{
            const r=await call('updateQA', no, {q, a:$('#mq-a').value});
            if(!r.ok){ toast(r.error||'失敗'); return false; }
            return true;
          }, modalBtns().filter(b=>b!==btn));
          if(ok){ $('#modal-qa').classList.remove('show'); toast('保存しました'); loadQA(); }
        };
        $('#mq-del').onclick=async ()=>{
          if(!confirm('この質問を削除しますか？\nNo.'+no+'　'+item.q)) return;
          const btn=$('#mq-del');
          const ok=await runWithButton(btn, {loading:'削除中…', done:'削除しました ✓'}, async ()=>{
            const r=await call('deleteQA', no);
            if(!r.ok){ toast(r.error||'失敗'); return false; }
            return true;
          }, modalBtns().filter(b=>b!==btn));
          if(ok){ $('#modal-qa').classList.remove('show'); toast('削除しました'); loadQA(); }
        };
      });
    });
  }catch(e){wrap.innerHTML='<div class="empty">読み込み失敗：'+esc(e.message||e)+'</div>';}
}
</script>
